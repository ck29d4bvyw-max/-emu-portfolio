<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EMU — BETWEEN</title><style>
:root{--bg:#0b0b0b;--fg:#f5f2ec;--muted:#9c9994;--line:#222}*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}header{position:sticky;top:0;z-index:20;padding:16px 20px;background:linear-gradient(180deg,rgba(11,11,11,.95),rgba(11,11,11,.75),rgba(11,11,11,0))}.brand{font-size:11px;letter-spacing:.18em;color:#c9c4bc;text-transform:uppercase}.hero{position:relative;min-height:52svh;display:flex;align-items:flex-end;padding:24px 20px 28px}.hero:before{content:"";position:absolute;inset:0;background:url('assets/01_umbrella.jpeg') center/cover no-repeat;filter:brightness(.78)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.22) 50%,rgba(0,0,0,.78))}.hero-inner{position:relative;z-index:1}h1{margin:0;font-family:"Times New Roman","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(54px,18vw,96px);line-height:.84;font-weight:400;letter-spacing:-.06em}.lede{margin:10px 0 0;color:#ddd;font-size:15px}.works{padding:12px 0 60px}.work{padding:26px 20px 34px;border-top:1px solid var(--line)}.meta{display:flex;justify-content:space-between;gap:10px;color:#777;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}.imgbtn{display:block;width:100%;border:0;background:#111;padding:0;cursor:zoom-in}.imgbtn img{display:block;width:100%;height:auto;background:#111}.title{margin-top:12px;color:#f5f2ec;font-size:17px;font-family:"Times New Roman","YuMincho","Hiragino Mincho ProN",serif}.footer{padding:28px 20px 50px;border-top:1px solid var(--line);color:#999;font-size:12px;line-height:1.8}.viewer{position:fixed;inset:0;z-index:99;background:#000;display:none;align-items:center;justify-content:center;padding:16px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:100%;width:auto;height:auto}.close{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:42px;height:42px;border-radius:999px;border:0;background:rgba(23,23,23,.85);color:#fff;font-size:24px}@media(min-width:700px){body{max-width:620px;margin:auto;border-inline:1px solid #222}.hero{min-height:60vh}}
</style></head><body><header><div class="brand">EMU — BETWEEN</div></header><section class="hero"><div class="hero-inner"><h1>BETWEEN</h1><p class="lede">境界に残る人物の気配。</p></div></section><main class="works"><section class="work"><div class="meta"><span>VEIL 01</span><span>01/10</span></div><button class="imgbtn" aria-label="Rainを拡大"><img loading="lazy" src="assets/01_umbrella.jpeg" alt="Rain"></button><div class="title">Rain</div></section>
<section class="work"><div class="meta"><span>VEIL 02</span><span>02/10</span></div><button class="imgbtn" aria-label="Bookを拡大"><img loading="lazy" src="assets/02_book.jpeg" alt="Book"></button><div class="title">Book</div></section>
<section class="work"><div class="meta"><span>BOUNDARY 01</span><span>03/10</span></div><button class="imgbtn" aria-label="Condensationを拡大"><img loading="lazy" src="assets/03_condensation.jpeg" alt="Condensation"></button><div class="title">Condensation</div></section>
<section class="work"><div class="meta"><span>BOUNDARY 02</span><span>04/10</span></div><button class="imgbtn" aria-label="Windowを拡大"><img loading="lazy" src="assets/04_window.jpeg" alt="Window"></button><div class="title">Window</div></section>
<section class="work"><div class="meta"><span>REFLECTION 01</span><span>05/10</span></div><button class="imgbtn" aria-label="Reflectionを拡大"><img loading="lazy" src="assets/11_mirror.jpeg" alt="Reflection"></button><div class="title">Reflection</div></section>
<section class="work"><div class="meta"><span>BOUNDARY 03</span><span>06/10</span></div><button class="imgbtn" aria-label="Carを拡大"><img loading="lazy" src="assets/06_car.jpeg" alt="Car"></button><div class="title">Car</div></section>
<section class="work"><div class="meta"><span>SPACE 01</span><span>07/10</span></div><button class="imgbtn" aria-label="Cafeを拡大"><img loading="lazy" src="assets/07_cafe.jpeg" alt="Cafe"></button><div class="title">Cafe</div></section>
<section class="work"><div class="meta"><span>SPACE 02</span><span>08/10</span></div><button class="imgbtn" aria-label="Stairsを拡大"><img loading="lazy" src="assets/08_stairs.jpeg" alt="Stairs"></button><div class="title">Stairs</div></section>
<section class="work"><div class="meta"><span>SPACE 03</span><span>09/10</span></div><button class="imgbtn" aria-label="Structureを拡大"><img loading="lazy" src="assets/09_teal.jpeg" alt="Structure"></button><div class="title">Structure</div></section>
<section class="work"><div class="meta"><span>FRAGMENT 01</span><span>10/10</span></div><button class="imgbtn" aria-label="Hairを拡大"><img loading="lazy" src="assets/10_hair.jpeg" alt="Hair"></button><div class="title">Hair</div></section></main><footer class="footer">@Emu70679Emu</footer><div class="viewer" aria-hidden="true"><button class="close" aria-label="閉じる">×</button><img alt=""></div><script>const v=document.querySelector('.viewer'),vi=v.querySelector('img');document.querySelectorAll('.imgbtn').forEach(b=>b.addEventListener('click',()=>{const i=b.querySelector('img');vi.src=i.src;vi.alt=i.alt;v.classList.add('open');document.body.style.overflow='hidden';}));function c(){v.classList.remove('open');document.body.style.overflow='';vi.src='';}document.querySelector('.close').addEventListener('click',c);v.addEventListener('click',e=>{if(e.target===v)c();});addEventListener('keydown',e=>{if(e.key==='Escape')c();});</script></body></html>
