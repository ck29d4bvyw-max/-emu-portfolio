<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1ece3">
<title>ある日の午後 — 乙広モネ × EMU</title>
<style>
:root{--paper:#f1ece3;--ink:#1e1d1a;--soft:#8b857c;--rule:#d7d0c5}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.cover{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:max(26px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));}
.kicker{font-size:10px;letter-spacing:.18em;color:var(--soft)}
.cover-center{padding:12vh 0 6vh}.cover h1{margin:0;font-family:"YuMincho","Hiragino Mincho ProN","Times New Roman",serif;font-size:clamp(44px,14vw,82px);font-weight:400;letter-spacing:.02em;line-height:1.08}.credit{margin-top:18px;font-size:12px;letter-spacing:.09em;color:#5f5a53}.cover-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;color:var(--soft);letter-spacing:.12em}.scroll{writing-mode:vertical-rl}
.book{overflow:hidden}.spread{min-height:92svh;display:flex;align-items:center;justify-content:center;padding:10vh 0}.spread img{display:block;height:auto;object-fit:contain}.full{padding:0;min-height:auto}.full img{width:100%;max-height:none}.wide img{width:min(92vw,1180px)}.medium img{width:min(82vw,980px)}.narrow img{width:min(72vw,720px)}.small img{width:min(62vw,620px)}
.pause{min-height:36svh;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:10px;letter-spacing:.25em}.chapter{min-height:46svh;display:flex;align-items:flex-end;padding:0 22px 8vh}.chapter p{font-family:"YuMincho","Hiragino Mincho ProN",serif;font-size:15px;line-height:2;color:#58534c;max-width:20em;margin:0}.end{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 22px}.end .line{width:42px;height:1px;background:var(--ink);margin-bottom:32px}.end h2{font-family:"YuMincho","Hiragino Mincho ProN",serif;font-size:25px;font-weight:400;margin:0 0 18px}.end p{font-size:10px;letter-spacing:.14em;color:var(--soft);margin:0}.end a{margin-top:54px;color:var(--soft);font-size:10px;text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:4px}
@media(min-width:780px){body{max-width:1100px;margin:0 auto}.cover{padding-left:56px;padding-right:56px}.chapter{padding-left:56px}.spread{min-height:100vh}.full img{width:100%}}
</style>
</head>
<body>
<section class="cover">
  <div class="kicker">A PHOTO STORY</div>
  <div class="cover-center">
    <h1>ある日の午後</h1>
    <div class="credit">乙広モネ × EMU</div>
  </div>
  <div class="cover-bottom"><span>2026</span><span class="scroll">SCROLL</span></div>
</section>

<main class="book">
  <figure class="spread wide"><img src="assets/01_place.jpg" alt="喫茶店の入口"></figure>
  <figure class="spread full"><img src="assets/02_street.jpg" alt="午後の街"></figure>
  <div class="pause">AFTERNOON</div>
  <figure class="spread medium"><img src="assets/03_light.jpg" alt="テーブルに落ちる午後の光"></figure>
  <section class="chapter"><p>光が動くまで、そこにいた。</p></section>
  <figure class="spread wide"><img src="assets/04_back.jpg" alt="窓を向く後ろ姿"></figure>
  <figure class="spread full"><img src="assets/05_room.jpg" alt="喫茶店の窓辺"></figure>
  <figure class="spread narrow"><img src="assets/06_window.jpg" alt="アーチ窓の横顔"></figure>
  <div class="pause">TIME PASSES</div>
  <figure class="spread wide"><img src="assets/07_pause.jpg" alt="テーブルに伏せる姿"></figure>
  <figure class="spread medium"><img src="assets/08_close.jpg" alt="暖かな光の横顔"></figure>
  <figure class="spread narrow"><img src="assets/09_end.jpg" alt="午後の終わり"></figure>
</main>

<section class="end">
  <div class="line"></div>
  <h2>ある日の午後</h2>
  <p>OTSUHIRO MONE × EMU</p>
  <a href="../">EMU PORTFOLIO</a>
</section>
</body>
</html>
